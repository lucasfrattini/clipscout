<!doctype html>
<html lang="es" data-app="clipscout">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>clipscout</title>
    <meta name="description" content="Explorador de enlaces y recursos multimedia de sitios web." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/cg/cg-ui.css" />
    <link rel="stylesheet" href="/styles/crew.css" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/una-mano.css" />

    <!--
      Favicons. Llevan una placa clara HORNEADA en la propia imagen, a
      diferencia del logo de la cabecera, que va transparente: el arte es
      azul marino y sobre la pestaña de un navegador en tema oscuro quedaría
      casi invisible. La pestaña no es nuestra, así que no se puede resolver
      con CSS.
    -->
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.saltar">Saltar al contenido</a>

    <!--
      Navegación (fase 3): Buscar · Actividad · Ajustes. Abajo en el móvil, barra lateral en
      escritorio (componente común cg-ui). «Avanzado» ya no está aquí: es el editor de un sitio
      (Ajustes → Búsqueda → Sitios → Editar); #/explorer sigue funcionando.
    -->
    <cg-barra-inferior data-i18n="nav.aria" data-i18n-attr="etiqueta" etiqueta="Herramientas">
      <a data-marca class="cs-marca" href="/">
        <img src="/img/logo.png" alt="" width="34" height="34" />
        <span class="cs-marca-texto">
          <small>Clipgeist</small>
          <span>clipscout</span>
        </span>
      </a>
      <a href="#/buscar" data-icono="buscar" data-vista="buscar"
        ><span data-i18n="nav.buscar">Buscar</span></a
      >
      <a href="#/actividad" data-icono="actividad" data-vista="actividad"
        ><span data-i18n="nav.actividad">Actividad</span></a
      >
      <a href="#/ajustes" data-icono="ajustes" data-vista="ajustes"
        ><span data-i18n="nav.ajustes">Ajustes</span></a
      >
    </cg-barra-inferior>

    <div class="layout">
      <main id="main" class="main">
        <section id="view-buscar" class="view" aria-labelledby="buscar-heading"></section>
        <section
          id="view-actividad"
          class="view"
          hidden
          aria-labelledby="actividad-heading"
        ></section>
        <section
          id="view-explorer"
          class="view"
          hidden
          aria-labelledby="explorer-heading"
        ></section>
        <section id="view-video" class="view" hidden aria-labelledby="video-heading"></section>
        <section id="view-ajustes" class="view" hidden aria-labelledby="ajustes-heading"></section>
      </main>

      <footer class="footer">
        <span
          id="health-indicator"
          class="status-dot status-dot--unknown"
          aria-hidden="true"
        ></span>
        <span id="health-text" data-i18n="salud.comprobando">Verificando el servicio…</span>
      </footer>
    </div>

    <!--
      Menú del logo: las tres apps de Clipgeist (con la dirección desde la que se ve esta página),
      la guía y «Salir». Lo abre el botón del logo de cada cabecera.
    -->
    <cg-hoja id="hoja-apps" titulo="Clipgeist">
      <nav
        class="cc-apps cs-apps"
        id="crew-apps"
        data-i18n="crew.aria"
        data-i18n-attr="aria-label"
        aria-label="Apps de Clipgeist"
      ></nav>
      <div class="cs-apps-acciones">
        <button class="cg-boton" id="guia" type="button" data-i18n="guia.ayuda">Guía rápida</button>
      </div>
    </cg-hoja>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="/cg/cg-ui.js" defer></script>
    <script src="/js/guia.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
