<!doctype html>
<html lang="es" data-app="clipscout">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>clipscout</title>
    <meta name="description" content="Explorador de enlaces y recursos multimedia de sitios web." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/cg/cg-ui.css" />
    <link rel="stylesheet" href="/styles/crew.css" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/una-mano.css" />
    <!--
      CS-15: los módulos que app.js importa de forma estática, pedidos todos a la vez en lugar de
      descubrirse uno detrás de otro (cada nivel de import era una ida y vuelta más). Las demás
      pantallas se cargan al abrirlas. tests/fase5-carga.test.js vigila que esta lista sea
      exactamente la del grafo de imports.
    -->
    <link rel="modulepreload" href="/js/app.js" />
    <link rel="modulepreload" href="/js/api.js" />
    <link rel="modulepreload" href="/js/i18n/index.js" />
    <link rel="modulepreload" href="/js/views/buscar.js" />
    <link rel="modulepreload" href="/js/dom.js" />
    <link rel="modulepreload" href="/js/components/jdEnvio.js" />
    <link rel="modulepreload" href="/js/components/dialog.js" />
    <link rel="modulepreload" href="/js/carpetas.js" />
    <link rel="modulepreload" href="/js/components/altaSitios.js" />
    <link rel="modulepreload" href="/js/filtros.js" />
    <link rel="modulepreload" href="/js/albumes.js" />
    <link rel="modulepreload" href="/js/hojas.js" />
    <link rel="modulepreload" href="/js/unaMano.js" />
    <link rel="modulepreload" href="/js/buscarModelo.js" />
    <link rel="modulepreload" href="/js/appsCrew.js" />
    <link rel="modulepreload" href="/js/tema.js" />

    <!--
      Favicons. Llevan una placa clara HORNEADA en la propia imagen, a
      diferencia del logo de la cabecera, que va transparente: el arte es
      azul marino y sobre la pestaña de un navegador en tema oscuro quedaría
      casi invisible. La pestaña no es nuestra, así que no se puede resolver
      con CSS.
    -->
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />

    <!--
      Instalable en el móvil (SU-14), igual que clipkeeper y clonbuster: manifiesto con iconos
      192/512 y «maskable», y el color de la barra del sistema según el tema (tema.js lo cambia si
      se elige uno a mano en Ajustes → Apariencia).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="clipscout" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.saltar">Saltar al contenido</a>

    <!--
      Navegación: Buscar · Avanzada · Actividad · Ajustes · Apps. Abajo en el móvil, barra lateral
      en escritorio (componente común cg-ui). «Apps» es siempre el último botón, igual en las tres
      apps de Clipgeist: abre la hoja con las otras apps, la guía y «Salir».
    -->
    <cg-barra-inferior data-i18n="nav.aria" data-i18n-attr="etiqueta" etiqueta="Herramientas">
      <a data-marca class="cs-marca" href="/">
        <img src="/img/logo-68.png" alt="" width="34" height="34" />
        <span class="cs-marca-texto">
          <small>Clipgeist</small>
          <span>clipscout</span>
        </span>
      </a>
      <a href="#/buscar" data-icono="buscar" data-vista="buscar"
        ><span data-i18n="nav.buscar">Buscar</span></a
      >
      <a href="#/explorer" data-icono="varita" data-vista="explorer"
        ><span data-i18n="nav.avanzada">Explorar</span></a
      >
      <a href="#/actividad" data-icono="actividad" data-vista="actividad"
        ><span data-i18n="nav.actividad">Actividad</span></a
      >
      <a href="#/ajustes" data-icono="ajustes" data-vista="ajustes"
        ><span data-i18n="nav.ajustes">Ajustes</span></a
      >
      <button type="button" id="boton-apps" data-icono="mas" aria-haspopup="dialog">
        <span data-i18n="nav.mas">Más</span>
      </button>
    </cg-barra-inferior>

    <div class="layout">
      <main id="main" class="main">
        <section id="view-buscar" class="view" aria-labelledby="buscar-heading"></section>
        <section
          id="view-actividad"
          class="view"
          hidden
          aria-labelledby="actividad-heading"
        ></section>
        <section
          id="view-explorer"
          class="view"
          hidden
          aria-labelledby="explorer-heading"
        ></section>
        <section id="view-video" class="view" hidden aria-labelledby="video-heading"></section>
        <section id="view-ajustes" class="view" hidden aria-labelledby="ajustes-heading"></section>
      </main>

      <footer class="footer">
        <span
          id="health-indicator"
          class="status-dot status-dot--unknown"
          aria-hidden="true"
        ></span>
        <span id="health-text" data-i18n="salud.comprobando">Verificando el servicio…</span>
      </footer>
    </div>

    <!--
      Hoja «Apps»: las tres apps de Clipgeist (con la dirección desde la que se ve esta página), la
      guía y «Salir». La abre el último botón de la barra.
    -->
    <cg-hoja id="hoja-apps" titulo="Clipgeist">
      <nav
        class="cc-apps cs-apps"
        id="crew-apps"
        data-i18n="crew.aria"
        data-i18n-attr="aria-label"
        aria-label="Apps de Clipgeist"
      ></nav>
      <div class="cs-apps-acciones">
        <button class="cg-boton" id="guia" type="button" data-i18n="guia.ayuda">Guía rápida</button>
      </div>
    </cg-hoja>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="/cg/cg-ui.js" defer></script>
    <script src="/js/guia.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
