<!doctype html>
<html lang="es" data-app="clipscout">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clipscout</title>
    <meta name="description" content="Explorador de enlaces y recursos multimedia de sitios web." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/styles/crew.css" />
    <link rel="stylesheet" href="/styles/main.css" />

    <!--
      Favicons. Llevan una placa clara HORNEADA en la propia imagen, a
      diferencia del logo de la cabecera, que va transparente: el arte es
      azul marino y sobre la pestaña de un navegador en tema oscuro quedaría
      casi invisible. La pestaña no es nuestra, así que no se puede resolver
      con CSS.
    -->
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.saltar">Saltar al contenido</a>

    <div class="layout">
      <!-- Cabecera COMÚN de clip crew (styles/crew.css): igual en clonbuster y clipkeeper. -->
      <header class="cc-cabecera">
        <div class="cc-cabecera-dentro">
          <a class="cc-marca" href="/">
            <img src="/img/logo.png" alt="" width="38" height="38" />
            <span class="cc-marca-texto">
              <span class="cc-crew">clip crew</span>
              <span class="cc-nombre">clipscout</span>
            </span>
          </a>

          <nav
            class="cc-menu"
            data-i18n="nav.aria"
            data-i18n-attr="aria-label"
            aria-label="Herramientas"
          >
            <button class="tab" data-view="buscar" type="button" aria-current="page">
              <span class="tab__label" data-i18n="nav.buscar">Buscar</span>
            </button>
            <button class="tab" data-view="explorer" type="button">
              <span class="tab__label" data-i18n="nav.explorador">Avanzado</span>
            </button>
            <!-- «Vídeos» ya no va en el menú: pegar un enlace en Buscar hace lo mismo. #/video sigue. -->
            <button class="tab" data-view="ajustes" type="button">
              <span class="tab__label" data-i18n="nav.ajustes">Ajustes</span>
            </button>
          </nav>

          <div class="cc-derecha">
            <!-- Las tres apps de clip crew; las no conectadas aparecen apagadas. -->
            <nav
              class="cc-apps"
              id="crew-apps"
              data-i18n="crew.aria"
              data-i18n-attr="aria-label"
              aria-label="Apps de clip crew"
            ></nav>
          </div>
        </div>
      </header>

      <main id="main" class="main">
        <section id="view-buscar" class="view" aria-labelledby="buscar-heading"></section>
        <section
          id="view-explorer"
          class="view"
          hidden
          aria-labelledby="explorer-heading"
        ></section>
        <section id="view-video" class="view" hidden aria-labelledby="video-heading"></section>
        <section id="view-ajustes" class="view" hidden aria-labelledby="ajustes-heading"></section>
      </main>

      <footer class="footer">
        <span
          id="health-indicator"
          class="status-dot status-dot--unknown"
          aria-hidden="true"
        ></span>
        <span id="health-text" data-i18n="salud.comprobando">Verificando el servicio…</span>
      </footer>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
