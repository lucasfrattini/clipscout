name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # La batería del servidor también en Windows (SU-21): ahí se usa la versión de escritorio.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  # Prueba de humo de la interfaz con un navegador de verdad (asistente → buscar en un sitio falso
  # → enviar a una cola falsa). Aparte, para no alargar ni bloquear la batería principal.
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm i --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: timeout 300 npm run e2e
