name: Paquetes

# Instaladores sin Docker: .exe para Windows (Inno Setup) y .tar.gz para Linux x64. Normalmente se
# compilan en local con empaquetado/compilar.sh (gratis); esto queda solo como opción manual
# (Actions → Paquetes → Run workflow), porque en repos privados gasta minutos de Actions.
on:
  workflow_dispatch:

jobs:
  paquete:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            so: windows
          - os: ubuntu-22.04  # glibc antigua: el binario sirve en más distribuciones
            so: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      APP: clipscout
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: python -m pip install pyinstaller pystray Pillow
      - name: Ejecutable
        working-directory: empaquetado
        run: pyinstaller --noconfirm lanzador.spec
      - name: Node y la app junto al lanzador
        run: |
          d=empaquetado/dist/$APP
          mkdir -p $d/node $d/app
          cp "$(command -v node)" $d/node/
          cp -r server.js package.json package-lock.json src public $d/app/
          (cd $d/app && npm ci --omit=dev --no-audit --no-fund && rm package-lock.json)
          $d/node/node* --version
      - name: Prueba de humo
        working-directory: empaquetado
        run: python humo.py
      - name: Instalador de Windows
        if: runner.os == 'Windows'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || { choco install innosetup -y --no-progress; }
          v=$(cd empaquetado && python -c "import ajustes_app as A; print(A.version())")
          "$ISCC" //Q //DApp=$APP //DNombre=$APP //DVersion=$v empaquetado/instalador.iss
      - name: Paquete de Linux
        if: runner.os == 'Linux'
        run: bash empaquetado/linux-tar.sh
      - name: Sumas SHA-256
        run: cd salida && sha256sum * > $APP-${{ matrix.so }}.sha256 && cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ matrix.so }}
          path: salida/*
          retention-days: 14
